spring.application.name=library-be

# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:library-db}:${DB_PORT:5432}/${DB_NAME:library}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:localdev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migracije
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
server.shutdown=graceful

# Actuator / health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# CORS (custom app postavka)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
