# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
name: Docker Image Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
env:
  AWS_REGION: eu-central-1
  IMAGE_NAME: ${{ secrets.ECR_REGISTRY }}/library/library-be
jobs:
  docker:
    name: Build & Push Backend image
    runs-on: ubuntu-latest
    # workflow se okida ili ručnim pokretanjem ili ako uspešno CI prođe
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write   # OIDC token za AWS (bez sačuvanih ključeva)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build-uj tačno onaj commit koji je prošao CI (ne najnoviji main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Generate Image tag
        id: image
        shell: bash
        run: |
          DATE_TAG=$(TZ=Europe/Belgrade date +'%Y%m%d_%H%M')
          FULL_TAG="${IMAGE_NAME}:${DATE_TAG}"
          LATEST_TAG="${IMAGE_NAME}:latest"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Docker image: ${FULL_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (bez push-a, Trivy prvo skenira)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          pull: true
          tags: |
            ${{ steps.image.outputs.full_tag }}
            ${{ steps.image.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true

      - name: Scan image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.full_tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false     # Trivy će oboriti pipeline iako ne postoji patch!
          format: table
          output: trivy-report.txt
          exit-code: 1

      # Prikazuje rezultat u GitHub Actions logu, čak i kada je Trivy prethodno oborio pipeline
      - name: Display Trivy report
        if: always()
        shell: bash
        run: |
          if [ -f trivy-report.txt ]; then
            cat trivy-report.txt
          else
            echo "Trivy report was not generated."
          fi

      # Čuva izveštaj kao GitHub Actions artifact.
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-library-be-report
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 14

      # Ovi koraci se izvršavaju samo ako Trivy uspe.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push versioned image
        shell: bash
        run: docker push "${{ steps.image.outputs.full_tag }}"

      - name: Push latest image
        shell: bash
        run: docker push "${{ steps.image.outputs.latest_tag }}"

      # ---- GitOps: upis novog taga u manifest repozitorijum ----
      - name: Upis taga u library-manifest
        env:
          GH_TOKEN:      ${{ secrets.MANIFEST_WRITE_PAT }}
          NEW_TAG:       ${{ steps.image.outputs.date_tag }}
          MANIFEST_REPO: jovan-vukasinovic-platform/library-manifest
          VALUES_FILE:   environment/dev/values.yaml
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${MANIFEST_REPO}.git" manifest
          cd manifest
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Optimisticko zakljucavanje: procitaj -> izmeni -> upisi, uz ponavljanje
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            yq -i '.["library-be"].image.tag = strenv(NEW_TAG)
                   | .["library-be"].image.tag style="double"' "${VALUES_FILE}"

            git add "${VALUES_FILE}"
            if git diff --cached --quiet; then
              echo "Manifest vec sadrzi tag ${NEW_TAG} - nema izmene."
              exit 0
            fi

            git commit -m "chore(library-be): image tag -> ${NEW_TAG}"
            if git push origin HEAD:main; then
              echo "Tag ${NEW_TAG} upisan u ${MANIFEST_REPO}."
              exit 0
            fi

            echo "Push odbijen (paralelan upis), pokusaj ${attempt} od 3."
            sleep $(( attempt * 3 ))
          done

          echo "::error::Upis taga u ${MANIFEST_REPO} nije uspeo nakon tri pokusaja."
          exit 1
